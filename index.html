<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跑團紀錄</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #1b1612; color: #f4ead8;
    font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", "Microsoft JhengHei", serif;
  }
  header { text-align: center; padding: 4rem 1rem 2rem; }
  header h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: .3em; }
  header p { margin: .6rem 0 0; color: #b8a58a; letter-spacing: .15em; }
  .list { max-width: 1000px; margin: 0 auto; padding: 1rem 1.5rem 4rem;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.6rem; }
  .entry { display: block; text-decoration: none; color: inherit; background: #2a221b;
    border: 1px solid #4a3c2e; border-radius: 12px; overflow: hidden;
    transition: transform .2s, box-shadow .2s; }
  .entry:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.5); }
  .entry img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
  .entry .info { padding: 1rem 1.2rem 1.2rem; }
  .entry .no { color: #c9894f; font-size: .8rem; letter-spacing: .25em; }
  .entry h2 { margin: .2rem 0 .4rem; font-size: 1.4rem; letter-spacing: .1em; }
  .entry p { margin: 0; color: #b8a58a; font-size: .9rem; line-height: 1.7; }
  footer { text-align: center; color: #6d5f4f; font-size: .8rem; padding: 0 1rem 2rem; }
</style>
</head>
<body>

<header>
  <h1>跑團紀錄</h1>
  <p>Discord AI TRPG</p>
</header>

<main class="list">
  <a class="entry" href="9th/index.html">
    <img src="9th/images/cg4.jpg" alt="灰燼迴廊">
    <div class="info">
      <div class="no">第九團</div>
      <h2>灰燼迴廊</h2>
      <p>天風・RQMA・霸哥・牛五花傑克森<br>結局：奪取均衡之力</p>
    </div>
  </a>
</main>

<footer>Discord AI TRPG</footer>

</body>
</html>
